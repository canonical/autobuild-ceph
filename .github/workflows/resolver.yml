name: AI Resolver

on:
  workflow_run:
    workflows: ["Build Ceph"]
    types: [completed]
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      model_provider:
        description: "Model provider (gemini or openrouter)"
        default: "gemini"
        required: false
      model_name:
        description: "Model ID (Gemini or OpenRouter)"
        default: "gemini-3.1-pro-preview"
        required: false
      max_iterations:
        description: "Maximum resolver iterations"
        default: "1000"
        required: false
      run_token_budget:
        description: "Total token budget for the run"
        default: "16000000"
        required: false
      launchpad_owner:
        description: Launchpad owner namespace for the ceph source repo
        required: false
        default: lmlogiudice

jobs:
  resolve:
    name: AI resolver (${{ matrix.name }})
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted-linux-amd64-noble-xlarge]
    timeout-minutes: 720

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: resolute
            lxd_image: ubuntu-daily:resolute
            ubuntu_branch: ubuntu/resolute
            debian_ref: origin/ubuntu/latest
            ceph_version: 20.2.0
          - name: noble
            lxd_image: ubuntu:24.04
            ubuntu_branch: ubuntu/noble
            debian_ref: origin/ubuntu/noble
            ceph_version: 19.2.3

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Model / budget knobs — workflow_dispatch inputs take precedence, then
      # repo-level Actions variables, then hard-coded defaults.
      MODEL_PROVIDER: ${{ github.event.inputs.model_provider || vars.RESOLVER_MODEL_PROVIDER || 'gemini' }}
      MODEL_NAME: ${{ github.event.inputs.model_name || vars.RESOLVER_MODEL_NAME || 'gemini-3.1-pro-preview' }}
      MAX_ITERATIONS: ${{ github.event.inputs.max_iterations || vars.RESOLVER_MAX_ITERATIONS || '1000' }}
      MAX_UNCHANGED_ITERATIONS: "5"
      MAX_WALL_SECONDS: "7200"
      RUN_TOKEN_BUDGET: ${{ github.event.inputs.run_token_budget || '16000000' }}
      # Build matrix — sourced from the strategy matrix above to stay in sync
      # with the Build Ceph workflow.
      MATRIX_NAME: ${{ matrix.name }}
      CEPH_VERSION: ${{ matrix.ceph_version }}
      UBUNTU_BRANCH: ${{ matrix.ubuntu_branch }}
      DEBIAN_REF: ${{ matrix.debian_ref }}
      LAUNCHPAD_OWNER: ${{ github.event.inputs.launchpad_owner || 'lmlogiudice' }}
      # Write the diff to a separate file so the job log shows only the
      # narrative; the raw patch is uploaded as a workflow artifact.
      CI_DIFF_FILE: "${{ github.workspace }}/resolver-diff.patch"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Install and initialize LXD
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          sudo usermod -aG lxd "$USER"

      - name: Run resolver
        # sg lxd makes the lxd group effective for this step so pylxd can
        # connect to the LXD unix socket without sudo.
        # sg spawns a fresh shell that doesn't inherit the parent environment.
        # Write env vars (including secrets) to a chmod 600 temp file and
        # source it inside sg so secret values never appear in the process list.
        run: |
          _env_file=$(mktemp)
          chmod 600 "$_env_file"
          # Unquoted heredoc: shell expands variables before writing to file.
          # Secrets land in a 600-perms file, not in the process list.
          cat > "$_env_file" << ENVEOF
          export GEMINI_API_KEY="${GEMINI_API_KEY}"
          export OPENROUTER_API_KEY="${OPENROUTER_API_KEY}"
          export MODEL_PROVIDER="${MODEL_PROVIDER}"
          export MODEL_NAME="${MODEL_NAME}"
          export MAX_ITERATIONS="${MAX_ITERATIONS}"
          export MAX_UNCHANGED_ITERATIONS="${MAX_UNCHANGED_ITERATIONS}"
          export MAX_WALL_SECONDS="${MAX_WALL_SECONDS}"
          export RUN_TOKEN_BUDGET="${RUN_TOKEN_BUDGET}"
          export MATRIX_NAME="${MATRIX_NAME}"
          export CEPH_VERSION="${CEPH_VERSION}"
          export UBUNTU_BRANCH="${UBUNTU_BRANCH}"
          export DEBIAN_REF="${DEBIAN_REF}"
          export LAUNCHPAD_OWNER="${LAUNCHPAD_OWNER}"
          export CI_DIFF_FILE="${CI_DIFF_FILE}"
          ENVEOF
          sg lxd -c ". $_env_file && bash run-resolver.sh --prep-image ${{ matrix.lxd_image }}"
          rm -f "$_env_file"

      - name: Upload resolver transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolver-transcript-${{ matrix.name }}
          path: resolver/resolver-transcript.jsonl
          if-no-files-found: ignore

      - name: Upload diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolver-diff-${{ matrix.name }}
          path: "${{ github.workspace }}/resolver-diff.patch"
          if-no-files-found: ignore
