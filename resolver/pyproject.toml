[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceph-autobuild-resolver"
version = "0.1.0"
description = "AI-driven build-failure resolution loop for Ceph autobuild"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pylxd>=2.3",
    "rich>=13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-mock>=3.12",
]

[project.scripts]
ceph-autobuild-resolver = "ceph_autobuild_resolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
